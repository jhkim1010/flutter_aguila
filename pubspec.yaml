name: flutter_app
description: A Flutter app for database connection with celebration animation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.20.2
  local_auth: ^2.3.0
  window_manager: ^0.3.7
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  excel: ^4.0.4
  network_info_plus: ^7.0.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.jpg
    - assets/config.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

msix_config:
  # identity_name 은 android applicationId 와 동일하게 맞춘다.
  # 플레이스홀더(com.yourcompany.*)를 두면 msix:create 가
  # "invalid identity name" 으로 실패해 Windows CI 의 아티팩트 업로드까지 막힌다.
  display_name: Be COOL
  publisher_display_name: Cool Sistema
  identity_name: com.coolsistema.becoolaguila
  # 서명 인증서의 Subject 와 한 글자도 다르면 Windows 가 설치를 거부한다.
  # ~/code-signing/becool-cert.pem 의 Subject 이며, 인증서를 재발급하면 함께 고쳐야 한다.
  # 확인: openssl x509 -in becool-cert.pem -noout -subject -nameopt RFC2253
  publisher: CN=Cool Sistema, O=Cool Sistema, C=AR
  logo_path: assets\icon.png